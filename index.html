<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital - 8º Ano</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Cabeçalho da página -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">8º Ano</p>
    <p class="estudante">Estudante Exemplo</p>
  </header>

  <main class="conteudo">

    <!-- Área dos cards de resumo -->
    <section class="cards-resumo">
      <div class="card">
        <h2>Média Geral</h2>
        <p id="media-geral">--</p>
      </div>

      <div class="card">
        <h2>Total de Faltas</h2>
        <p id="total-faltas">--</p>
      </div>

      <div class="card">
        <h2>Bom Desempenho</h2>
        <p id="qtd-bom-desempenho">--</p>
      </div>

      <div class="card">
        <h2>Precisam de Atenção</h2>
        <p id="qtd-atencao">--</p>
      </div>

      <div class="card">
        <h2>Frequência</h2>
        <p id="frequencia">--</p>
        <small id="frequencia-status">--</small>
      </div>
    </section>

    <!-- Área da tabela de disciplinas -->
    <section class="tabela-area">
      <h2>Notas por Disciplina</h2>
      <div class="tabela-responsiva">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- As linhas serão inseridas pelo JavaScript -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <footer class="rodape">
    <p>Projeto escolar — dados fictícios para demonstração.</p>
  </footer>

  <!-- Script principal -->
  <script src="script.js"></script>
</body>
</html>
